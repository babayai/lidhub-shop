<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidhub Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; background: #eee; }
        .product-name { font-size: 18px; font-weight: bold; margin: 10px 0; }
        .product-price { color: #0088cc; font-size: 16px; margin-bottom: 15px; font-weight: bold; }
        .btn { background: #0088cc; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; font-size: 14px; }
        .cart-status { position: fixed; bottom: 20px; width: 90%; max-width: 360px; background: #31b545; color: white; padding: 15px; border-radius: 12px; text-align: center; display: none; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

<div class="container" id="shop-container">
    <p style="text-align: center;">Загрузка товаров...</p>
</div>

<div class="cart-status" id="cart-btn">
    Оформить заказ: <span id="total-price">0</span> UZS
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready(); // Сообщаем Telegram, что приложение готово

    let cart = [];
    let totalPrice = 0;

    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTN5uMA3s-VGFwwN_PW0gFgn_hB_RQPjnzDosEC1FIhYvYedLVmNyRjJ8yVrtZU_ODqEY2ccp36xp4a/pub?output=csv";

    async function loadProducts() {
        try {
            const response = await fetch(sheetUrl + "&t=" + new Date().getTime());
            const data = await response.text();
            const rows = data.split('\n').slice(1);
            const container = document.getElementById('shop-container');
            container.innerHTML = '';

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 5) {
                    const name = cols[2].replace(/"/g, "").trim();
                    const price = parseInt(cols[4]);
                    const img = cols[5].replace(/"/g, "").replace(/\r/g, "").trim();

                    if (name && !isNaN(price)) {
                        const card = document.createElement('div');
                        card.className = 'product-card';
                        card.innerHTML = `
                            <img src="${img}" class="product-img" onerror="this.src='https://via.placeholder.com/200?text=No+Image'">
                            <div class="product-name">${name}</div>
                            <div class="product-price">${price.toLocaleString()} UZS</div>
                            <button class="btn" onclick="addToCart('${name}', ${price})">Добавить</button>
                        `;
                        container.appendChild(card);
                    }
                }
            });
        } catch (e) {
            console.error(e);
        }
    }

    function addToCart(name, price) {
        cart.push({name, price});
        totalPrice += price;
        document.getElementById('total-price').innerText = totalPrice.toLocaleString();
        document.getElementById('cart-btn').style.display = 'block';
    }

    // Слушатель нажатия на кнопку корзины
    document.getElementById('cart-btn').addEventListener('click', function() {
        if (totalPrice > 0) {
            const data = JSON.stringify({ total: totalPrice });
            tg.sendData(data); // Отправляем данные в бота
        }
    });

    loadProducts();
</script>
</body>
</html>
