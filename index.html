<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidhub Premium Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f0f0f; color: white; margin: 0; padding: 15px; }
        .header { text-align: center; padding: 20px 0; border-bottom: 1px solid #333; }
        .category-nav { display: flex; gap: 10px; overflow-x: auto; margin: 20px 0; padding-bottom: 10px; }
        .cat-btn { background: #222; color: #ccc; border: 1px solid #444; padding: 8px 15px; border-radius: 20px; white-space: nowrap; }
        .cat-btn.active { background: #007aff; color: white; border: none; }
        
        .products { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background: #1a1a1a; padding: 12px; border-radius: 15px; border: 1px solid #333; }
        .product-card img { width: 100%; border-radius: 10px; margin-bottom: 10px; }
        .product-card h3 { font-size: 0.85em; margin: 5px 0; height: 35px; overflow: hidden; }
        .product-card .price { color: #007aff; font-weight: bold; font-size: 1.1em; }
        
        .add-btn { background: #fff; color: #000; border: none; padding: 10px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 10px; cursor: pointer; }
        
        #cart-bar { position: fixed; bottom: 20px; left: 15px; right: 15px; background: #007aff; color: white; padding: 15px; border-radius: 15px; text-align: center; display: none; font-weight: bold; box-shadow: 0 5px 15px rgba(0,122,255,0.4); }
    </style>
</head>
<body>
    <div class="header">
        <h2 style="margin:0;">Lidhub Retail OS</h2>
        <p style="font-size: 0.8em; color: #888;">Premium Fragrance Selection</p>
    </div>

    <div class="category-nav">
        <div class="cat-btn active">Все</div>
        <div class="cat-btn">Мужские</div>
        <div class="cat-btn">Женские</div>
        <div class="cat-btn">Унисекс</div>
    </div>

    <div class="products">
        <div class="product-card">
            <img src="https://img.fragrancex.com/images/products/parent/medium/60541m.jpg">
            <h3>Armani GIO Profumo</h3>
            <div class="price">$105</div>
            <button class="add-btn" onclick="addToCart('Armani GIO', 105)">В корзину</button>
        </div>
        <div class="product-card">
            <img src="https://img.fragrancex.com/images/products/parent/medium/1138m.jpg">
            <h3>Dior Sauvage EDP</h3>
            <div class="price">$125</div>
            <button class="add-btn" onclick="addToCart('Sauvage', 125)">В корзину</button>
        </div>
    </div>

    <div id="cart-bar" onclick="sendToBot()">🛍 Оформить заказ: $<span id="total-price">0</span></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.hide();

        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name, price});
            total += price;
            document.getElementById('cart-bar').style.display = 'block';
            document.getElementById('total-price').innerText = total;
            tg.HapticFeedback.impactOccurred('heavy');
        }

        function sendToBot() {
            if (cart.length === 0) return;
            tg.sendData(JSON.stringify({items: cart, total: total}));
        }
    </script>
</body>
</html>
