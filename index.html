<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidhub Cloud Shop</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background-color: #f0f2f5; margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { max-width: 400px; width: 100%; }
        .product-card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-img { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; }
        .product-name { font-size: 18px; font-weight: bold; margin: 10px 0; }
        .product-price { color: #0088cc; font-size: 16px; margin-bottom: 10px; }
        .btn { background: #0088cc; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
        .cart-status { position: fixed; bottom: 20px; width: calc(100% - 30px); max-width: 370px; background: #31b545; color: white; padding: 15px; border-radius: 12px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>

<div class="container" id="shop-container">
    <p style="text-align: center;">Загрузка витрины Lidhub...</p>
</div>

<div class="cart-status" id="cart-btn" onclick="sendData()">
    Оформить заказ: <span id="total-price">0</span> UZS
</div>

<script>
    let tg = window.Telegram.WebApp;
    tg.expand();

    let cart = [];
    let totalPrice = 0;

    // Ссылка на твою опубликованную таблицу в формате CSV для легкого чтения
    const sheetUrl = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTN5uMA3s-VGFwwN_PW0gFgn_hB_RQPjnzDosEC1FIhYvYedLVmNyRjJ8yVrtZU_ODqEY2ccp36xp4a/pub?output=csv";

    async function loadProducts() {
        try {
            const response = await fetch(sheetUrl);
            const data = await response.text();
            const rows = data.split('\n').slice(1); // Пропускаем заголовок
            
            const container = document.getElementById('shop-container');
            container.innerHTML = ''; // Очищаем текст загрузки

            rows.forEach(row => {
                const cols = row.split(',');
                if (cols.length >= 5) {
                    const product = {
                        id: cols[0],
                        name: cols[2],
                        price: parseInt(cols[4]),
                        img: cols[5]
                    };

                    const card = document.createElement('div');
                    card.className = 'product-card';
                    card.innerHTML = `
                        <img src="${product.img}" class="product-img">
                        <div class="product-name">${product.name}</div>
                        <div class="product-price">${product.price.toLocaleString()} UZS</div>
                        <button class="btn" onclick="addToCart('${product.name}', ${product.price})">Добавить</button>
                    `;
                    container.appendChild(card);
                }
            });
        } catch (e) {
            console.error("Ошибка загрузки товаров:", e);
        }
    }

    function addToCart(name, price) {
        cart.push({name, price});
        totalPrice += price;
        document.getElementById('total-price').innerText = totalPrice.toLocaleString();
        document.getElementById('cart-btn').style.display = 'block';
    }

    function sendData() {
        const data = {
            items: cart,
            total: totalPrice
        };
        tg.sendData(JSON.stringify(data));
        tg.close();
    }

    loadProducts();
</script>
</body>
</html>
