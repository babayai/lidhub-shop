<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lidhub Digital Store</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; margin: 0; padding: 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .category-title { font-size: 1.2em; font-weight: bold; margin: 15px 0; color: #333; }
        
        /* Сетка товаров */
        .products { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .product-card { background: white; padding: 10px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .product-card img { width: 100%; border-radius: 8px; }
        .product-card h3 { font-size: 0.9em; margin: 10px 0 5px; }
        .product-card p { color: #007aff; font-weight: bold; margin: 0; }
        
        /* Кнопка купить */
        .add-btn { background: #007aff; color: white; border: none; padding: 8px 15px; border-radius: 20px; margin-top: 10px; width: 100%; font-weight: bold; }
        
        /* Корзина внизу */
        #cart-status { position: fixed; bottom: 0; left: 0; right: 0; background: #007aff; color: white; padding: 15px; text-align: center; display: none; font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Lidhub Shop</h2>
        <span id="user-name"></span>
    </div>

    <div class="category-title">Парфюмерия</div>
    <div class="products">
        <div class="product-card">
            <img src="https://img.fragrancex.com/images/products/parent/medium/60541m.jpg">
            <h3>Armani GIO</h3>
            <p>$100</p>
            <button class="add-btn" onclick="addToCart('Armani GIO', 100)">В корзину</button>
        </div>
        <div class="product-card">
            <img src="https://img.fragrancex.com/images/products/parent/medium/1138m.jpg">
            <h3>Sauvage</h3>
            <p>$120</p>
            <button class="add-btn" onclick="addToCart('Sauvage', 120)">В корзину</button>
        </div>
    </div>

    <div id="cart-status" onclick="sendOrder()">Оформить заказ (<span id="count">0</span>)</div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран
        
        let cart = [];
        let total = 0;

        function addToCart(name, price) {
            cart.push({name, price});
            total += price;
            document.getElementById('cart-status').style.display = 'block';
            document.getElementById('count').innerText = cart.length;
            tg.HapticFeedback.impactOccurred('medium'); // Виброотклик
        }

        function sendOrder() {
            let orderData = {
                items: cart,
                total: total
            };
            tg.sendData(JSON.stringify(orderData)); // Отправляем данные в бот
        }
    </script>
</body>
</html>
