<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lidhub Store</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

    <div class="header">
        <h2>LIDHUB <span>SYSTEMS</span></h2>
        <p>Premium Digital Equipment</p>
    </div>

    <div class="shop-container">
        <div class="product-card">
            <div class="product-img-placeholder">SMART BOT</div>
            <div class="product-name">Telegram Bot v2.0</div>
            <div class="price">250 000 сум</div>
            <button class="btn-add" onclick="addToCart(1, 'Bot v2.0', 250000)">В корзину</button>
        </div>
        
        <div class="product-card">
            <div class="product-img-placeholder">CRM</div>
            <div class="product-name">AmoCRM Integration</div>
            <div class="price">500 000 сум</div>
            <button class="btn-add" onclick="addToCart(2, 'CRM Integ', 500000)">В корзину</button>
        </div>

        <div class="product-card">
            <div class="product-img-placeholder">PARSING</div>
            <div class="product-name">База Клиентов</div>
            <div class="price">150 000 сум</div>
            <button class="btn-add" onclick="addToCart(3, 'Parsing Base', 150000)">В корзину</button>
        </div>

        <div class="product-card">
            <div class="product-img-placeholder">DESIGN</div>
            <div class="product-name">Logo & Brandbook</div>
            <div class="price">800 000 сум</div>
            <button class="btn-add" onclick="addToCart(4, 'Design Pack', 800000)">В корзину</button>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
